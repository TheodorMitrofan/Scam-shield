# Local PostgreSQL for the opt-in history (CLAUDE.md §4.3). Start: docker compose up -d postgres
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: scam
      POSTGRES_PASSWORD: scam   # local dev only
      POSTGRES_DB: scamshield
    ports:
      - "${POSTGRES_PORT:-5544}:5432"   # host 5544 (5432 is often taken by other projects)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scam -d scamshield"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
