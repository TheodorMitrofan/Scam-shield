[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scam_detector"
version = "3.0.0"
description = "Scam Shield SOTA v3 Tier-6 local detector: Neural-SVD+Linear ensemble, semantic matching, de-obfuscation, and contact verification"
requires-python = ">=3.9"
dependencies = [
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["scam_detector"]

[tool.setuptools.package-data]
scam_detector = ["data/*.json", "*.joblib"]
