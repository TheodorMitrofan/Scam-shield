@if (!auth.user()) {
  <app-login-view (authenticated)="onAuthenticated()" />
} @else {
<app-top-bar (paste)="pasteOpen.set(true)" (logout)="onLogout()" [(view)]="view" />

@if (view() === 'audio') {
  <app-audio-page />
} @else if (view() === 'dashboard') {
  <app-dashboard-view (openScenario)="openFromDashboard()" />
} @else {
<main class="layout" [class.show-detail]="showDetail()">
  <section class="list" aria-label="Scenarii">
    <app-inbox-list (opened)="showDetail.set(true)" />
  </section>
  <section class="detail" aria-label="Detaliu scenariu">
    <app-scenario-detail (back)="showDetail.set(false)" />
  </section>
</main>
}

<app-paste-dialog [(visible)]="pasteOpen" />
}
