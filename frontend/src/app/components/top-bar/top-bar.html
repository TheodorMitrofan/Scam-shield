<header class="top">
  <div class="brand">
    <span class="logo" aria-hidden="true"><i class="pi pi-shield"></i></span>
    <span class="name">Scam Shield</span>
    <p-selectbutton
      [options]="views"
      optionValue="value"
      [allowEmpty]="false"
      [ngModel]="view()"
      (ngModelChange)="view.set($event)"
      class="views"
      ariaLabel="Secțiune"
    >
      <ng-template #item let-o>
        <i [class]="o.icon" aria-hidden="true"></i><span>{{ o.label }}</span>
      </ng-template>
    </p-selectbutton>
  </div>

  <!-- Language + theme: same place on every page (top right, next to the view tabs). -->
  <div class="prefs">
    <p-selectbutton
      [options]="langs"
      optionLabel="label"
      optionValue="value"
      [allowEmpty]="false"
      [ngModel]="lang.lang()"
      (ngModelChange)="lang.set($event)"
      class="langs"
      ariaLabel="Limba avertismentelor / Warning language"
      pTooltip="Limba avertismentelor · Warning language"
      tooltipPosition="bottom"
    />
    <p-button
      [icon]="dark() ? 'pi pi-moon' : 'pi pi-sun'"
      severity="secondary"
      [outlined]="true"
      (onClick)="toggleTheme()"
      [ariaLabel]="dark() ? 'Temă deschisă' : 'Temă întunecată'"
      pTooltip="Schimbă tema"
      tooltipPosition="bottom"
    />
  </div>

  <div class="actions">
    @if (view() !== 'audio') {
    <button
      type="button"
      class="status"
      [class]="'status ' + status().kind"
      (click)="recheck()"
      [pTooltip]="status().hint"
      tooltipPosition="bottom"
    >
      <span class="dot" aria-hidden="true"></span>{{ status().label }}
    </button>
    }
    @if (view() !== 'audio') {
      <p-button
        label="Adaugă / Verifică"
        icon="pi pi-plus"
        [loading]="store.loading()"
        (onClick)="actionsOpen.set(true)"
      />
    }
    @if (auth.user(); as u) {
      <p-button
        icon="pi pi-sign-out"
        severity="secondary"
        [outlined]="true"
        [ariaLabel]="'Ieșire (' + u.username + ')'"
        [pTooltip]="'Ieșire (' + u.username + ' · ' + u.role + ')'"
        tooltipPosition="bottom"
        (onClick)="logout.emit()"
      />
    }
  </div>
</header>

<p-dialog
  header="Adaugă și configurează verificarea"
  [modal]="true"
  [(visible)]="actionsOpen"
  [style]="{ width: 'min(420px, 94vw)' }"
>
  <div class="modal-body">
    <p-button
      label="Lipește mesaj sau conversație"
      icon="pi pi-clipboard"
      [fluid]="true"
      (onClick)="openPaste()"
    />

    <div class="modal-grid">
      <label class="file-btn modal-file">
        <i class="pi pi-file" aria-hidden="true"></i>
        <span>Fișiere JSON</span>
        <input type="file" accept=".json,application/json" multiple (change)="onFiles($event)" />
      </label>
      <label class="file-btn modal-file">
        <i class="pi pi-folder" aria-hidden="true"></i>
        <span>Folder JSON</span>
        <input type="file" webkitdirectory multiple (change)="onFiles($event)" />
      </label>
    </div>

    @if (auth.isAdmin()) {
      <p-button
        label="Încarcă setul de validare (Admin)"
        icon="pi pi-folder-open"
        severity="secondary"
        [outlined]="true"
        [fluid]="true"
        [loading]="store.loading()"
        (onClick)="loadValidation()"
      />
    }

    <div class="modal-consent" (click)="store.saveHistory.set(!store.saveHistory())">
      <div class="consent-info">
        <strong>Salvează în istoric</strong>
        <small>Conversațiile verificate se păstrează în baza de date pentru contul dvs.</small>
      </div>
      <div class="consent-switch" (click)="$event.stopPropagation()">
        <p-toggleswitch
          [ngModel]="store.saveHistory()"
          (ngModelChange)="store.saveHistory.set($event)"
          inputId="consent"
        />
      </div>
    </div>
  </div>
</p-dialog>
