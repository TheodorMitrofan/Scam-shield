<header class="top">
  <div class="brand">
    <span class="logo" aria-hidden="true"><i class="pi pi-shield"></i></span>
    <span class="name">Scam Shield</span>
    <p-selectbutton
      [options]="views"
      optionValue="value"
      [allowEmpty]="false"
      [ngModel]="view()"
      (ngModelChange)="view.set($event)"
      class="views"
      [ariaLabel]="'Secțiune' | ui"
    >
      <ng-template #item let-o>
        <i [class]="o.icon" aria-hidden="true"></i><span>{{ o.label | ui }}</span>
      </ng-template>
    </p-selectbutton>
  </div>

  <!-- Language + theme: same place on every page (top right, next to the view tabs). -->
  <div class="prefs">
    <p-selectbutton
      [options]="langs"
      optionLabel="label"
      optionValue="value"
      [allowEmpty]="false"
      [ngModel]="lang.lang()"
      (ngModelChange)="lang.set($event)"
      class="langs"
      ariaLabel="Limba avertismentelor / Warning language"
      pTooltip="Limba avertismentelor · Warning language"
      tooltipPosition="bottom"
    />
    <p-button
      [icon]="dark() ? 'pi pi-moon' : 'pi pi-sun'"
      severity="secondary"
      [outlined]="true"
      (onClick)="toggleTheme()"
      [ariaLabel]="(dark() ? 'Temă deschisă' : 'Temă întunecată') | ui"
      [pTooltip]="'Schimbă tema' | ui"
      tooltipPosition="bottom"
    />
  </div>

  <div class="actions">
    @if (view() !== 'audio') {
    <button
      type="button"
      class="status"
      [class]="'status ' + status().kind"
      (click)="recheck()"
      [pTooltip]="status().hint"
      tooltipPosition="bottom"
    >
      <span class="dot" aria-hidden="true"></span>{{ status().label | ui }}
    </button>
    <label class="consent" [pTooltip]="'Doar dacă bifați, conversațiile verificate se păstrează (le puteți șterge oricând).' | ui" tooltipPosition="bottom">
      <p-toggleswitch
        [ngModel]="store.saveHistory()"
        (ngModelChange)="store.saveHistory.set($event)"
        inputId="consent"
      />
      <span>{{ 'Salvează în istoric' | ui }}</span>
    </label>
    }
    @if (view() !== 'audio') {
    <p-button
      [label]="'Setul de validare' | ui"
      icon="pi pi-folder-open"
      severity="secondary"
      [outlined]="true"
      [loading]="store.loading()"
      (onClick)="store.loadValidationSet()"
    />
    <label class="file-btn">
      <i class="pi pi-file" aria-hidden="true"></i> {{ 'Fișiere JSON' | ui }}
      <input type="file" accept=".json,application/json" multiple (change)="onFiles($event)" />
    </label>
    <label class="file-btn">
      <i class="pi pi-folder" aria-hidden="true"></i> {{ 'Folder' | ui }}
      <input type="file" webkitdirectory multiple (change)="onFiles($event)" />
    </label>
    <p-button [label]="'Lipește mesaj' | ui" icon="pi pi-clipboard" (onClick)="paste.emit()" />
    }
  </div>
</header>
